<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>명화 디지털 갤러리</title>
<meta name="description" content="세계 유수 미술관의 명화를 디지털 사이니지 포맷으로 큐레이션한 온라인 갤러리">
<style>
:root {
  --bg: #0c0c0f; --bg2: #141419; --line: #26262e;
  --fg: #ece9e2; --fg-dim: #9a968c; --accent: #c9a961;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--fg); font-family: 'Pretendard', 'Malgun Gothic', system-ui, sans-serif; font-size: 15px; }
h1, h2, h3, h4, .serif { font-family: 'Playfair Display', 'Nanum Myeongjo', Georgia, serif; }
img { -webkit-user-drag: none; user-select: none; }
/* 이미지 저장·드래그·길게눌러 저장 차단 */
body { -webkit-touch-callout: none; }
.art-card .im, #lb-img, #hero .bg, .ex-card .bg, #player .slide {
  -webkit-user-drag: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
}
/* 인쇄로 이미지 추출 차단 */
@media print {
  body * { display: none !important; }
  body::after { content: '© 이지커넥트 · 명화 디지털 갤러리 — 인쇄가 허용되지 않습니다.'; display: block !important; padding: 40px; font-size: 16px; }
}
a { color: inherit; text-decoration: none; }

header { position: sticky; top: 0; z-index: 20; background: rgba(12,12,15,.82); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.header-in { max-width: 1280px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; gap: 20px; }
#site-title { font-size: 21px; letter-spacing: 1px; cursor: pointer; }
#site-title span { color: var(--accent); }
.header-in .right { margin-left: auto; font-size: 13px; color: var(--fg-dim); }

#hero { position: relative; height: 46vh; min-height: 300px; display: flex; align-items: flex-end; overflow: hidden; }
#hero .bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(.45); transform: scale(1.04); }
/* 히어로 작품 롤링 — 두 레이어 크로스페이드 */
#hero .roll { opacity: 0; transition: opacity 1.6s ease; }
#hero .roll.on { opacity: 1; }
#hero .in { position: relative; max-width: 1280px; margin: 0 auto; width: 100%; padding: 0 24px 44px; }
#hero h2 { font-size: clamp(30px, 5vw, 54px); font-weight: 600; text-shadow: 0 2px 20px rgba(0,0,0,.6); }
#hero p { color: #cfc9bc; margin-top: 10px; max-width: 640px; line-height: 1.7; text-shadow: 0 1px 8px rgba(0,0,0,.7); }

.wrap { max-width: 1280px; margin: 0 auto; padding: 36px 24px 80px; }
.section-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.section-head h3 { font-size: 24px; }
.section-head .n { color: var(--fg-dim); font-size: 13px; }
.chips { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 20px; padding: 6px 16px; font-size: 13px; color: var(--fg-dim); cursor: pointer; background: none; }
.chip.active, .chip:hover { color: var(--accent); border-color: var(--accent); }

.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
.ex-card { position: relative; border-radius: 12px; overflow: hidden; cursor: pointer; aspect-ratio: 16/10; background: var(--bg2); border: 1px solid var(--line); }
.ex-card .bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform .5s ease; }
.ex-card:hover .bg { transform: scale(1.06); }
.ex-card .shade { position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(0,0,0,.85)); }
.ex-card .txt { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px; }
.ex-card .cat { font-size: 11px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; }
.ex-card h4 { font-size: 21px; font-weight: 600; margin-top: 4px; color: #fff; }
.ex-card .cnt { font-size: 12.5px; color: #b8b2a5; margin-top: 4px; }

#ex-hero { position: relative; height: auto; min-height: 52vh; display: flex; align-items: flex-end; overflow: hidden; }
#ex-hero .in { padding-top: 140px; }
#ex-hero .bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(.4); }
#ex-hero .in { position: relative; max-width: 1280px; margin: 0 auto; width: 100%; padding: 0 24px 40px; }
#ex-hero .cat { font-size: 12px; letter-spacing: 4px; color: var(--accent); text-transform: uppercase; }
#ex-hero h2 { font-size: clamp(28px, 4.5vw, 48px); margin-top: 6px; }
#ex-hero p { color: #cfc9bc; margin-top: 12px; max-width: 720px; line-height: 1.75; font-size: 15px; }
#ex-hero .actions { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; }
.btn { background: var(--accent); color: #16130a; border: none; border-radius: 8px; padding: 12px 26px; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.1); }
.btn.ghost { background: rgba(0,0,0,.4); color: var(--fg); border: 1px solid rgba(255,255,255,.35); font-weight: 400; }
.btn.ghost:hover { border-color: var(--accent); color: var(--accent); }

.art-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.art-card { border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--bg2); border: 1px solid var(--line); transition: transform .15s, border-color .15s; }
.art-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.art-card .im { aspect-ratio: 16/9; background: #000 center/cover no-repeat; overflow: hidden; }
.art-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.art-card .cap { padding: 12px 14px; }
.art-card .t { font-size: 14px; line-height: 1.4; }
.art-card .a { font-size: 12.5px; color: var(--fg-dim); margin-top: 3px; }

#lightbox { position: fixed; inset: 0; background: rgba(5,5,7,.96); z-index: 60; display: none; flex-direction: column; }
#lightbox.open { display: flex; }
#lb-stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 24px; min-height: 0; }
#lb-img { width: 100%; height: 100%; background: center/contain no-repeat; box-shadow: 0 10px 60px rgba(0,0,0,.7); }
#lb-cap { text-align: center; padding: 0 24px 28px; }
#lb-cap .t { font-family: 'Playfair Display', Georgia, serif; font-size: 20px; }
#lb-cap .a { color: var(--fg-dim); font-size: 14px; margin-top: 4px; }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.5); border: 1px solid var(--line); color: var(--fg); width: 46px; height: 46px; border-radius: 50%; font-size: 20px; cursor: pointer; }
.lb-nav:hover { border-color: var(--accent); color: var(--accent); }
#lb-prev { left: 18px; } #lb-next { right: 18px; }
#lb-close { position: absolute; top: 16px; right: 20px; background: none; border: none; color: var(--fg-dim); font-size: 26px; cursor: pointer; z-index: 5; }
#lb-close:hover { color: var(--fg); }

#music-modal { position: fixed; inset: 0; background: rgba(5,5,7,.85); z-index: 70; display: none; align-items: center; justify-content: center; padding: 20px; }
#music-modal.open { display: flex; }
#music-box { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 30px 34px; width: 420px; max-width: 100%; }
#music-box h3 { color: var(--accent); font-size: 20px; margin-bottom: 6px; }
#music-box p { color: var(--fg-dim); font-size: 13px; margin-bottom: 18px; }
.music-opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 14px; }
.music-opt:hover, .music-opt.sel { border-color: var(--accent); }
.music-opt input { accent-color: var(--accent); }
#music-box .foot { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }

#player { position: fixed; inset: 0; background: #000; display: none; z-index: 100; }
#player.open { display: block; }
#player .slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.6s ease; }
#player .slide.show { opacity: 1; }
#player .overlay { position: absolute; left: 0; right: 0; bottom: 0; padding: 70px 72px 54px; background: linear-gradient(transparent, rgba(0,0,0,.78)); opacity: 0; transition: opacity 1.1s ease .7s; }
#player .slide.show .overlay { opacity: 1; }
#player .overlay .t { font-family: 'Playfair Display', serif; font-size: clamp(24px, 3.4vw, 46px); font-weight: 600; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.6); }
#player .overlay .a { font-family: 'Playfair Display', serif; font-size: clamp(15px, 1.8vw, 23px); color: #d9cfb8; margin-top: 10px; letter-spacing: 2px; }
#player-ui { position: absolute; top: 0; left: 0; right: 0; padding: 18px 24px; display: flex; justify-content: flex-end; gap: 10px; opacity: 0; transition: opacity .3s; z-index: 5; }
#player:hover #player-ui { opacity: 1; }
#player-ui button { background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.3); color: #fff; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 13px; }
#player-ui button:hover { border-color: var(--accent); color: var(--accent); }

footer { border-top: 1px solid var(--line); padding: 30px 24px; text-align: center; color: var(--fg-dim); font-size: 13px; }
footer a:hover { color: var(--accent); }
#loading { text-align: center; color: var(--fg-dim); padding: 60px 0; }
@media (max-width: 640px) {
  #hero { height: 38vh; }
  #player .overlay { padding: 40px 26px 30px; }
}
::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: #26262e; border-radius: 5px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div class="header-in">
    <h1 id="site-title" onclick="location.hash='#/'">Digital <span>Masterpiece</span> Gallery</h1>
    <div class="right">세계 명화 컬렉션</div>
  </div>
</header>

<div id="view"><div id="loading">갤러리를 여는 중…</div></div>

<footer>
  <p>© 이지커넥트 · 명화 디지털 갤러리 — Digital Signage Collection</p>
  <p style="margin-top:6px"><a href="/admin.html">관리자</a></p>
</footer>

<div id="lightbox">
  <button id="lb-close">✕</button>
  <div id="lb-stage">
    <button class="lb-nav" id="lb-prev">‹</button>
    <div id="lb-img"></div>
    <button class="lb-nav" id="lb-next">›</button>
  </div>
  <div id="lb-cap"><div class="t"></div><div class="a"></div></div>
</div>

<div id="music-modal">
  <div id="music-box">
    <h3 class="serif">슬라이드쇼 설정</h3>
    <p>갤러리와 함께 재생할 음악을 선택하세요</p>
    <div id="music-list"></div>
    <div style="margin-top:16px">
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--fg-dim);margin-bottom:6px">
        <span>작품 전환 시간</span><b id="iv-val" style="color:var(--accent)">12초</b>
      </div>
      <input type="range" id="iv-range" min="5" max="60" step="1" value="12" style="width:100%;accent-color:var(--accent)">
    </div>
    <div class="foot">
      <button class="btn ghost" id="music-cancel">취소</button>
      <button class="btn" id="music-play">▶ 재생 시작</button>
    </div>
  </div>
</div>

<div id="player">
  <div id="player-ui">
    <button id="pl-pause">⏸ 일시정지</button>
    <button id="pl-exit">✕ 종료 (Esc)</button>
  </div>
  <audio id="pl-audio" loop></audio>
</div>

<script src="/vendor/supabase.js"></script>
<script src="/config.js"></script>
<script src="/shared.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

let EXS = null, MUSIC = [], EX_CACHE = {};

/* ───────── 이미지 보호 ───────── */
document.addEventListener('contextmenu', e => e.preventDefault());        // 우클릭 메뉴 전면 차단
document.addEventListener('dragstart', e => e.preventDefault());          // 드래그로 끌어내기 차단
document.addEventListener('selectstart', e => {                           // 이미지 영역 선택 차단
  if (e.target.closest('.art-card, #lb-img, #hero, #player, .ex-card')) e.preventDefault();
});
addEventListener('keydown', e => {                                        // 저장/소스보기/인쇄 단축키 차단
  const k = (e.key || '').toLowerCase();
  const mod = e.ctrlKey || e.metaKey;
  if (mod && ['s', 'u', 'p'].includes(k)) { e.preventDefault(); return false; }
  if (mod && e.shiftKey && ['i', 'j', 'c'].includes(k)) { e.preventDefault(); return false; }
  if (k === 'f12') { e.preventDefault(); return false; }
}, true);

async function loadSite() {
  if (EXS) return;
  const [exRes, muRes] = await Promise.all([
    sb.from('gallery_exhibitions').select('*, gallery_artworks(count)').eq('published', true).order('sort').order('name'),
    sb.from('gallery_music').select('*').order('name'),
  ]);
  if (exRes.error) throw new Error(exRes.error.message);
  EXS = (exRes.data || []).map(e => ({ ...e, count: e.gallery_artworks?.[0]?.count || 0 })).filter(e => e.count > 0);
  MUSIC = muRes.data || [];
  document.title = CFG.SITE_TITLE;
}

/* ───────── 라우터 ───────── */
async function route() {
  closePlayer(); closeLightbox();
  clearInterval(HERO_TIMER);
  const h = location.hash || '#/';
  try { await loadSite(); }
  catch (e) { $('#view').innerHTML = `<div id="loading">오류: ${e.message}</div>`; return; }
  const mEx = h.match(/^#\/ex\/([a-z0-9-]+)/);
  const mPlay = h.match(/^#\/play\/([a-z0-9-]+)(?:\?t=(\d+))?/);
  if (mPlay) {
    if (mPlay[2]) INTERVAL = Math.min(60, Math.max(5, +mPlay[2]));   // 사이니지 기기용: #/play/<id>?t=20
    return playExhibition(mPlay[1]);
  }
  if (mEx) return renderExhibition(mEx[1]);
  renderHome();
}
addEventListener('hashchange', route);

/* ───────── 홈 ───────── */
let FILTER = '전체';
let HERO_TIMER = null;

/* 히어로용 작품 이미지 무작위 수집 (여러 구간에서 뽑아 섞음) */
async function fetchHeroArtworks(total) {
  const BATCH = 12, PICKS = 3;
  const maxOffset = Math.max(0, total - BATCH);
  const offsets = Array.from({ length: PICKS }, () => Math.floor(Math.random() * (maxOffset + 1)));
  const res = await Promise.all(offsets.map(o =>
    sb.from('gallery_artworks').select('image_path').order('created_at').range(o, o + BATCH - 1)
  ));
  const seen = new Set(), list = [];
  for (const r of res) for (const a of (r.data || [])) {
    if (a.image_path && !seen.has(a.image_path)) { seen.add(a.image_path); list.push(a.image_path); }
  }
  for (let i = list.length - 1; i > 0; i--) {           // 셔플
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

/* 두 레이어를 번갈아 페이드하며 작품 롤링 */
async function startHeroRoll(total) {
  clearInterval(HERO_TIMER);
  let paths = [];
  try { paths = await fetchHeroArtworks(total); } catch { return; }
  if (!paths.length) return;
  const layers = [$('#hero-a'), $('#hero-b')];
  if (!layers[0] || !layers[1]) return;
  let idx = 0, cur = 0;
  const show = i => new Promise(resolve => {
    const im = new Image();
    im.onload = im.onerror = () => {
      const next = 1 - cur;
      layers[next].style.backgroundImage = `url('${artUrl(paths[i])}')`;
      layers[next].classList.add('on');
      layers[cur].classList.remove('on');
      cur = next;
      resolve();
    };
    im.src = artUrl(paths[i]);
  });
  await show(idx);
  HERO_TIMER = setInterval(async () => {
    if (!document.getElementById('hero-a')) { clearInterval(HERO_TIMER); return; }  // 홈을 벗어남
    idx = (idx + 1) % paths.length;
    await show(idx);
  }, 15000);
}

function renderHome() {
  const cats = ['전체', ...new Set(EXS.map(e => e.category))];
  const total = EXS.reduce((s, e) => s + e.count, 0);
  $('#view').innerHTML = `
    <div id="hero">
      <div class="bg roll" id="hero-a"></div>
      <div class="bg roll" id="hero-b"></div>
      <div class="in">
        <h2 class="serif">세계의 명화를<br>디지털로 만나다</h2>
        <p>세계 유수 미술관의 걸작 ${total.toLocaleString()}점을 디지털 사이니지 포맷으로 큐레이션한 온라인 갤러리입니다.</p>
      </div>
    </div>
    <div class="wrap">
      <div class="section-head">
        <h3 class="serif">전시</h3><span class="n" id="ex-n"></span>
        <div class="chips">${cats.map(c => `<button class="chip ${c === FILTER ? 'active' : ''}" data-c="${c}">${c}</button>`).join('')}</div>
      </div>
      <div class="ex-grid" id="ex-grid"></div>
    </div>`;
  $$('.chip').forEach(ch => ch.onclick = () => { FILTER = ch.dataset.c; renderHomeGrid(); $$('.chip').forEach(x => x.classList.toggle('active', x.dataset.c === FILTER)); });
  renderHomeGrid();
  startHeroRoll(total);
}
function renderHomeGrid() {
  const exs = EXS.filter(e => FILTER === '전체' || e.category === FILTER);
  $('#ex-n').textContent = `${exs.length}개 전시`;
  const g = $('#ex-grid');
  g.innerHTML = '';
  for (const ex of exs) {
    const d = document.createElement('div');
    d.className = 'ex-card';
    d.innerHTML = `
      <div class="bg" style="background-image:url('${artUrl(ex.cover_path)}')"></div>
      <div class="shade"></div>
      <div class="txt">
        <div class="cat">${ex.category}</div>
        <h4>${ex.name}</h4>
        <div class="cnt">작품 ${ex.count}점</div>
      </div>`;
    d.onclick = () => location.hash = '#/ex/' + ex.id;
    g.appendChild(d);
  }
}

/* ───────── 전시 상세 ───────── */
async function loadArtworks(id) {
  if (!EX_CACHE[id]) {
    const { data, error } = await sb.from('gallery_artworks').select('*')
      .eq('exhibition_id', id).order('sort').order('created_at');
    if (error) throw new Error(error.message);
    EX_CACHE[id] = data;
  }
  return EX_CACHE[id];
}
async function renderExhibition(id) {
  const ex = EXS.find(e => e.id === id);
  if (!ex) { location.hash = '#/'; return; }
  $('#view').innerHTML = '<div id="loading">전시를 준비하는 중…</div>';
  let items;
  try { items = await loadArtworks(id); }
  catch (e) { $('#view').innerHTML = `<div id="loading">${e.message}</div>`; return; }
  window.scrollTo(0, 0);
  $('#view').innerHTML = `
    <div id="ex-hero">
      <div class="bg" style="background-image:url('${artUrl(ex.cover_path)}')"></div>
      <div class="in">
        <div class="cat">${ex.category}</div>
        <h2 class="serif">${ex.name}</h2>
        <p>${ex.intro || ''}</p>
        <div class="actions">
          <button class="btn" id="ex-play">▶ 슬라이드쇼 감상</button>
          <button class="btn ghost" onclick="location.hash='#/'">← 전시 목록</button>
        </div>
      </div>
    </div>
    <div class="wrap">
      <div class="section-head"><h3 class="serif">작품</h3><span class="n">${items.length}점</span></div>
      <div class="art-grid" id="art-grid"></div>
    </div>`;
  const g = $('#art-grid');
  items.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'art-card';
    d.innerHTML = `
      <div class="im" style="background-image:url('${artUrl(it.thumb_path || it.image_path)}')"></div>
      <div class="cap"><div class="t">${it.title || ''}</div><div class="a">${it.artist || ''}${it.year ? ' · ' + it.year : ''}</div></div>`;
    d.onclick = () => openLightbox(items, i);
    g.appendChild(d);
  });
  $('#ex-play').onclick = () => askMusic(() => location.hash = '#/play/' + id);
}

/* ───────── 라이트박스 ───────── */
let LB = { items: [], idx: 0 };
function openLightbox(items, idx) {
  LB = { items, idx };
  $('#lightbox').classList.add('open');
  showLB();
}
function showLB() {
  const it = LB.items[LB.idx];
  $('#lb-img').style.backgroundImage = `url('${artUrl(it.image_path)}')`;
  $('#lb-cap .t').textContent = it.title || '';
  $('#lb-cap .a').textContent = (it.artist || '') + (it.year ? ' · ' + it.year : '');
}
function closeLightbox() { $('#lightbox').classList.remove('open'); }
$('#lb-close').onclick = closeLightbox;
$('#lb-prev').onclick = () => { LB.idx = (LB.idx - 1 + LB.items.length) % LB.items.length; showLB(); };
$('#lb-next').onclick = () => { LB.idx = (LB.idx + 1) % LB.items.length; showLB(); };
$('#lightbox').onclick = e => { if (e.target === $('#lightbox') || e.target === $('#lb-stage')) closeLightbox(); };

/* ───────── 음악·전환시간 설정 ───────── */
let MUSIC_SEL = null, onMusicOK = null;
let INTERVAL = Math.min(60, Math.max(5, parseInt(localStorage.getItem('gallery-interval')) || 12));
function askMusic(cb) {
  onMusicOK = cb;
  const list = $('#music-list');
  list.innerHTML = `<label class="music-opt sel"><input type="radio" name="mu" value="" checked> 음악 없이 감상</label>` +
    MUSIC.map(m => `<label class="music-opt"><input type="radio" name="mu" value="${m.path}"> ♪ ${m.name}</label>`).join('');
  if (!MUSIC.length) list.innerHTML += `<p style="color:var(--fg-dim);font-size:12px;margin-top:4px">등록된 음악이 없습니다.</p>`;
  $$('.music-opt').forEach(o => o.onclick = () => { $$('.music-opt').forEach(x => x.classList.remove('sel')); o.classList.add('sel'); });
  $('#iv-range').value = INTERVAL;
  $('#iv-val').textContent = INTERVAL + '초';
  $('#music-modal').classList.add('open');
}
$('#iv-range').oninput = e => { $('#iv-val').textContent = e.target.value + '초'; };
$('#music-cancel').onclick = () => $('#music-modal').classList.remove('open');
$('#music-play').onclick = () => {
  MUSIC_SEL = document.querySelector('input[name=mu]:checked')?.value || null;
  INTERVAL = +$('#iv-range').value;
  localStorage.setItem('gallery-interval', INTERVAL);
  $('#music-modal').classList.remove('open');
  if (onMusicOK) onMusicOK();
};

/* ───────── 슬라이드쇼 ───────── */
let playTimer = null, playIdx = 0, playItems = [], paused = false;
async function playExhibition(id) {
  let items;
  try { items = await loadArtworks(id); } catch (e) { location.hash = '#/'; return; }
  if (!items.length) { location.hash = '#/'; return; }
  playItems = items;
  playIdx = 0; paused = false;
  const p = $('#player');
  p.querySelectorAll('.slide').forEach(s => s.remove());
  p.classList.add('open');
  const audio = $('#pl-audio');
  if (MUSIC_SEL) { audio.src = musicUrl(MUSIC_SEL); audio.volume = .55; audio.play().catch(() => {}); }
  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  showSlide(0);
  playTimer = setInterval(nextSlide, INTERVAL * 1000);
  $('#pl-pause').textContent = '⏸ 일시정지';
}
function nextSlide() { if (!paused) showSlide((playIdx + 1) % playItems.length); }
function showSlide(i) {
  playIdx = i;
  const p = $('#player');
  const it = playItems[i];
  const s = document.createElement('div');
  s.className = 'slide';
  s.style.backgroundImage = `url('${artUrl(it.image_path)}')`;
  s.innerHTML = `<div class="overlay"><div class="t">${it.title || ''}</div><div class="a">${it.artist || ''}${it.year ? ' · ' + it.year : ''}</div></div>`;
  p.appendChild(s);
  requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('show')));
  const slides = p.querySelectorAll('.slide');
  if (slides.length > 2) slides[0].remove();
  if (slides.length > 1) slides[slides.length - 2].classList.remove('show');
  const nxt = playItems[(i + 1) % playItems.length];
  if (nxt) { const im = new Image(); im.src = artUrl(nxt.image_path); }
}
$('#pl-pause').onclick = () => { paused = !paused; $('#pl-pause').textContent = paused ? '▶ 재생' : '⏸ 일시정지'; };
$('#pl-exit').onclick = () => history.back();
function closePlayer() {
  const p = $('#player');
  if (!p.classList.contains('open')) return;
  p.classList.remove('open');
  clearInterval(playTimer);
  $('#pl-audio').pause();
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
addEventListener('keydown', e => {
  if ($('#player').classList.contains('open')) {
    if (e.key === 'Escape') history.back();
    if (e.key === 'ArrowRight') { clearInterval(playTimer); showSlide((playIdx + 1) % playItems.length); playTimer = setInterval(nextSlide, INTERVAL * 1000); }
    if (e.key === 'ArrowLeft') { clearInterval(playTimer); showSlide((playIdx - 1 + playItems.length) % playItems.length); playTimer = setInterval(nextSlide, INTERVAL * 1000); }
    if (e.key === ' ') { e.preventDefault(); $('#pl-pause').click(); }
  } else if ($('#lightbox').classList.contains('open')) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') $('#lb-next').click();
    if (e.key === 'ArrowLeft') $('#lb-prev').click();
  }
});

route();
</script>
</body>
