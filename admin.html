<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 — 명화 디지털 갤러리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #101014; --bg2: #17171d; --bg3: #1f1f27; --line: #2a2a35;
  --fg: #e9e6df; --fg-dim: #9a968c; --accent: #c9a961;
  --ok: #6fbf8f; --danger: #d9705f;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: 'Pretendard', 'Malgun Gothic', system-ui, sans-serif; font-size: 14px; }
h1, h2, h3, .serif { font-family: 'Playfair Display', Georgia, serif; }

#login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 500; display: flex; align-items: center; justify-content: center; }
#login-box { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 40px 44px; width: 380px; text-align: center; }
#login-box h1 { color: var(--accent); font-size: 24px; margin-bottom: 6px; }
#login-box p { color: var(--fg-dim); font-size: 12px; margin-bottom: 24px; }
#login-box input { width: 100%; margin-bottom: 12px; }
#login-box button { width: 100%; }
#login-err { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 16px; }

#topbar { position: sticky; top: 0; z-index: 30; background: var(--bg2); border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
#topbar h1 { font-size: 18px; color: var(--accent); }
#topbar .nav { display: flex; gap: 4px; }
#topbar .nav button { background: none; border: none; color: var(--fg-dim); padding: 8px 14px; cursor: pointer; font-size: 13px; border-radius: 6px; }
#topbar .nav button.active { color: var(--accent); background: var(--bg3); }
.spacer { flex: 1; }
#content { max-width: 1280px; margin: 0 auto; padding: 24px; }

button.btn { background: var(--bg3); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 13px; }
button.btn:hover { border-color: var(--accent); color: var(--accent); }
button.btn.primary { background: var(--accent); color: #16130a; border-color: var(--accent); font-weight: 600; }
button.btn.primary:hover { filter: brightness(1.1); color: #16130a; }
button.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
button.btn:disabled { opacity: .4; cursor: default; }
input[type=text], input[type=password], select, textarea { background: var(--bg3); border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
textarea { resize: vertical; }

.ex-row { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; display: flex; gap: 16px; }
.ex-row .cover { width: 200px; min-width: 200px; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; background: #000; position: relative; }
.ex-row .cover img { width: 100%; height: 100%; object-fit: cover; }
.ex-row .fields { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ex-row .row1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pub-toggle { display: flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; }
.pub-toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.card { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; position: relative; }
.card .imgwrap { aspect-ratio: 16/9; background: #000; overflow: hidden; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .info { padding: 8px 10px; }
.card .info input { width: 100%; margin-bottom: 4px; padding: 4px 8px; font-size: 12px; }
.card .acts { display: flex; gap: 6px; padding: 0 10px 10px; }
.card .acts button { flex: 1; padding: 5px; font-size: 11.5px; }

.panel { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
.panel h3 { color: var(--accent); margin-bottom: 14px; font-size: 16px; }
.panel .frow { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
#drop { border: 2px dashed var(--line); border-radius: 10px; padding: 30px; text-align: center; color: var(--fg-dim); cursor: pointer; }
#drop.over { border-color: var(--accent); color: var(--accent); }

/* 크롭 모달 */
#crop-modal { position: fixed; inset: 0; background: rgba(8,8,10,.95); display: none; z-index: 100; flex-direction: column; }
#crop-modal.open { display: flex; }
#crop-head { padding: 12px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#crop-head .meta-inputs { display: flex; gap: 8px; flex: 1; min-width: 280px; }
#crop-head input { flex: 1; min-width: 50px; }
#crop-stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; padding: 20px; min-height: 0; }
#crop-wrap { position: relative; user-select: none; max-width: 100%; max-height: 100%; }
/* 해상도·비율과 무관하게 항상 편집 화면(뷰포트) 안에 고정 — 상단바/하단바 높이를 제외한 영역 기준 */
#crop-img { display: block; width: auto; height: auto; max-width: calc(100vw - 48px); max-height: calc(100vh - 200px); pointer-events: none; }
#crop-box { position: absolute; border: 2px solid var(--accent); box-shadow: 0 0 0 9999px rgba(0,0,0,.55); cursor: move; }
#crop-box::after { content: ''; position: absolute; inset: 0; background:
  linear-gradient(to right, transparent 33.2%, rgba(255,255,255,.25) 33.2%, rgba(255,255,255,.25) 33.5%, transparent 33.5%, transparent 66.2%, rgba(255,255,255,.25) 66.2%, rgba(255,255,255,.25) 66.5%, transparent 66.5%),
  linear-gradient(to bottom, transparent 33.2%, rgba(255,255,255,.25) 33.2%, rgba(255,255,255,.25) 33.5%, transparent 33.5%, transparent 66.2%, rgba(255,255,255,.25) 66.2%, rgba(255,255,255,.25) 66.5%, transparent 66.5%); }
.handle { position: absolute; width: 16px; height: 16px; background: var(--accent); border-radius: 50%; z-index: 2; }
.handle.br { right: -9px; bottom: -9px; cursor: nwse-resize; }
#crop-foot { padding: 12px 24px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
#crop-info { color: var(--fg-dim); font-size: 12px; }

/* 표지 선택 모달 */
#picker { position: fixed; inset: 0; background: rgba(8,8,10,.92); display: none; z-index: 150; flex-direction: column; }
#picker.open { display: flex; }
#picker .head { padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
#picker .body { flex: 1; overflow-y: auto; padding: 20px 24px; }
#picker .card { cursor: pointer; }
#picker .card:hover { border-color: var(--accent); }

#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid var(--accent); color: var(--fg); padding: 12px 24px; border-radius: 8px; display: none; z-index: 600; font-size: 13px; max-width: 90vw; }

/* ── 표지 생성기 ── */
#maker { position: fixed; inset: 0; background: rgba(8,8,10,.95); display: none; z-index: 140; align-items: center; justify-content: center; padding: 20px; }
#maker.open { display: flex; }
#maker-box { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 22px; width: 1060px; max-width: 100%; max-height: 96vh; overflow-y: auto; display: flex; gap: 20px; flex-wrap: wrap; }
#maker-canvas { width: 640px; max-width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; display: block; }
#maker-ctl { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 12px; }
#maker-ctl h3 { color: var(--accent); font-size: 17px; }
#maker-ctl label.fld { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--fg-dim); }
#maker-ctl input[type=text] { width: 100%; }
#maker-ctl input[type=range] { accent-color: var(--accent); width: 100%; }
#maker-ctl .btns { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }

@media (max-width: 720px) { .ex-row { flex-direction: column; } .ex-row .cover { width: 100%; } }
::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 5px; }
</style>
</head>
<body>

<div id="login-overlay">
  <div id="login-box">
    <h1>Gallery Admin</h1>
    <p>관리자 로그인 — 어디서든 접속해 갤러리를 관리하세요</p>
    <input type="text" id="login-email" placeholder="이메일" value="gallery-admin@wellbianlabs.io">
    <input type="password" id="login-pw" placeholder="비밀번호">
    <button class="btn primary" id="login-go">로그인</button>
    <div id="login-err"></div>
    <p style="margin-top:18px"><a href="/" style="color:var(--fg-dim)">← 공개 갤러리로</a></p>
  </div>
</div>

<div id="app" style="display:none">
  <div id="topbar">
    <h1>Gallery Admin</h1>
    <div class="nav">
      <button data-tab="exhibit" class="active">전시·작품</button>
      <button data-tab="music">음악</button>
    </div>
    <div class="spacer"></div>
    <a href="/" style="color:var(--fg-dim);font-size:13px">공개사이트↗</a>
    <button class="btn" id="pw-open" style="padding:5px 12px;font-size:12px">비밀번호 변경</button>
    <button class="btn" id="logout" style="padding:5px 12px;font-size:12px">로그아웃</button>
  </div>
  <div id="content"></div>
</div>

<!-- 크롭 모달 -->
<div id="crop-modal">
  <div id="crop-head">
    <h3 class="serif" style="color:var(--accent)">16:9 크롭</h3>
    <span id="crop-queue" style="color:var(--fg-dim);font-size:12px"></span>
    <div class="meta-inputs">
      <input type="text" id="m-title" placeholder="작품명">
      <input type="text" id="m-artist" placeholder="작가" style="max-width:200px">
      <input type="text" id="m-year" placeholder="연도" style="max-width:80px">
    </div>
    <label class="pub-toggle" title="원본 파일도 비공개 보관함에 저장"><input type="checkbox" id="keep-original"> 원본 보관</label>
    <button class="btn" id="crop-close" title="크롭 취소 (Esc) — 남은 대기열도 모두 취소됩니다">✕ 닫기</button>
  </div>
  <div id="crop-stage">
    <div id="crop-wrap">
      <img id="crop-img">
      <div id="crop-box"><div class="handle br"></div></div>
    </div>
  </div>
  <div id="crop-foot">
    <span id="crop-info"></span>
    <div class="spacer"></div>
    <button class="btn" id="crop-reset">전체 맞춤</button>
    <button class="btn danger" id="crop-skip">건너뛰기</button>
    <button class="btn primary" id="crop-save">✓ 업로드 (1920×1080)</button>
  </div>
</div>

<!-- 표지 선택 -->
<!-- 비밀번호 변경 팝업 -->
<div id="pwmod" style="position:fixed;inset:0;background:rgba(8,8,10,.85);display:none;z-index:170;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:26px 30px;width:400px;max-width:100%">
    <h3 class="serif" style="color:var(--accent);font-size:18px;margin-bottom:6px">관리자 비밀번호 변경</h3>
    <p style="color:var(--fg-dim);font-size:12px;margin-bottom:16px">변경 즉시 모든 기기의 관리자 로그인에 새 비밀번호가 적용됩니다.</p>
    <input type="password" id="pw-new" placeholder="새 비밀번호 (8자 이상)" style="width:100%;margin-bottom:10px">
    <input type="password" id="pw-new2" placeholder="새 비밀번호 확인" style="width:100%;margin-bottom:6px">
    <p id="pw-err" style="color:var(--danger);font-size:12px;min-height:16px;margin-bottom:10px"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn" id="pw-cancel">취소</button>
      <button class="btn primary" id="pw-save" style="min-width:110px">변경</button>
    </div>
  </div>
</div>

<!-- 사이니지 URL 팝업 -->
<div id="surl" style="position:fixed;inset:0;background:rgba(8,8,10,.85);display:none;z-index:160;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:26px 30px;width:560px;max-width:100%">
    <h3 class="serif" style="color:var(--accent);font-size:18px;margin-bottom:4px">사이니지 자동재생 URL</h3>
    <p id="surl-ex" style="color:var(--fg-dim);font-size:12.5px;margin-bottom:16px"></p>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <span style="font-size:13px;color:var(--fg-dim)">작품 전환 시간</span>
      <input type="number" id="surl-t" min="5" max="60" value="15" style="width:70px;background:var(--bg3);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 8px">
      <span style="font-size:13px;color:var(--fg-dim)">초</span>
    </div>
    <input type="text" id="surl-url" readonly style="width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:10px;font-size:12px;margin-bottom:14px">
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn" id="surl-close">닫기</button>
      <button class="btn primary" id="surl-copy" style="min-width:130px">📋 복사하기</button>
    </div>
  </div>
</div>

<!-- 표지 생성기 -->
<div id="maker">
  <div id="maker-box">
    <div>
      <canvas id="maker-canvas" width="1920" height="1080"></canvas>
      <p style="color:var(--fg-dim);font-size:11.5px;margin-top:8px">미리보기 = 실제 저장본(1920×1080)</p>
    </div>
    <div id="maker-ctl">
      <h3 class="serif">표지 생성기</h3>
      <div class="btns">
        <label class="btn" style="cursor:pointer">배경 파일 선택<input type="file" id="mk-bgfile" accept="image/jpeg,image/png,image/webp" style="display:none"></label>
        <button class="btn" id="mk-bgart">작품에서 배경 선택</button>
      </div>
      <label class="fld">제목 (전시명)
        <input type="text" id="mk-title" placeholder="예: 클라크 아트 인스티튜트">
      </label>
      <label class="fld">부제
        <input type="text" id="mk-sub" value="소장 작품선">
      </label>
      <label class="fld"><span>띠 어둡기 <b class="mk-val" data-for="mk-band" style="color:var(--accent)">38%</b></span><input type="range" id="mk-band" min="0" max="80" value="38"></label>
      <label class="fld"><span>띠 높이 <b class="mk-val" data-for="mk-bandh" style="color:var(--accent)">403px</b></span><input type="range" id="mk-bandh" min="80" max="800" value="403"></label>
      <label class="fld"><span>배경 어둡기 <b class="mk-val" data-for="mk-dim" style="color:var(--accent)">0%</b></span><input type="range" id="mk-dim" min="0" max="70" value="0"></label>
      <label class="fld"><span>제목 크기 <b class="mk-val" data-for="mk-tsize" style="color:var(--accent)">180px</b></span><input type="range" id="mk-tsize" min="50" max="220" value="180"></label>
      <label class="fld"><span>부제 크기 <b class="mk-val" data-for="mk-ssize" style="color:var(--accent)">69px</b></span><input type="range" id="mk-ssize" min="20" max="90" value="69"></label>
      <label class="fld"><span>제목·부제 간격 <b class="mk-val" data-for="mk-gap" style="color:var(--accent)">145px</b></span><input type="range" id="mk-gap" min="40" max="260" value="145"></label>
      <label class="fld"><span>글자 세로 위치 <b class="mk-val" data-for="mk-y" style="color:var(--accent)">52%</b></span><input type="range" id="mk-y" min="25" max="80" value="52"></label>
      <label class="pub-toggle" style="margin-top:4px" title="체크하면 현재 설정(띠/어둡기/크기/위치/부제)이 저장되어 다른 전시 표지를 만들 때도 기준값으로 적용됩니다">
        <input type="checkbox" id="mk-keep"> 이 설정을 기본값으로 유지
      </label>
      <div class="btns" style="margin-top:auto">
        <button class="btn" id="mk-cancel">취소</button>
        <button class="btn primary" id="mk-save">✓ 표지로 저장</button>
      </div>
    </div>
  </div>
</div>

<div id="picker">
  <div class="head">
    <h3 style="color:var(--accent)" id="picker-title">표지로 사용할 작품 선택</h3>
    <button class="btn" onclick="document.getElementById('picker').classList.remove('open')">✕ 닫기</button>
  </div>
  <div class="body"><div class="grid" id="picker-grid"></div></div>
</div>

<div id="toast"></div>

<script src="/vendor/jszip.min.js"></script>
<script src="/vendor/supabase.js"></script>
<script src="/config.js"></script>
<script src="/shared.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3200); };
const uid = () => crypto.randomUUID();

let TAB = 'exhibit';
let EXS = [];
let OPEN_EX = null; // 펼쳐진 전시 id

/* ───────── 인증 ───────── */
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { $('#login-overlay').style.display = 'none'; $('#app').style.display = 'block'; render(); }
}
$('#login-go').onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('#login-email').value.trim(), password: $('#login-pw').value });
  if (error) { $('#login-err').textContent = '로그인 실패: ' + error.message; return; }
  location.reload();
};
$('#login-pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#login-go').click(); });
$('#logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

$$('#topbar .nav button').forEach(b => b.onclick = () => {
  $$('#topbar .nav button').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); TAB = b.dataset.tab; render();
});
function render() { TAB === 'exhibit' ? renderExhibit() : renderMusic(); }

/* ───────── 전시·작품 ───────── */
async function loadExs() {
  const { data, error } = await sb.from('gallery_exhibitions').select('*, gallery_artworks(count)').order('sort').order('name');
  if (error) { toast('오류: ' + error.message); return []; }
  return data.map(e => ({ ...e, count: e.gallery_artworks?.[0]?.count || 0 }));
}
async function renderExhibit() {
  $('#content').innerHTML = '<p style="color:var(--fg-dim)">불러오는 중…</p>';
  EXS = await loadExs();
  const c = document.createElement('div');
  c.innerHTML = `
    <div class="panel">
      <h3>새 전시 만들기</h3>
      <div class="frow">
        <input type="text" id="new-name" placeholder="전시명 (예: 루브르 박물관)" style="flex:1;min-width:200px">
        <select id="new-cat"><option>미술관</option><option>작가</option><option>특별전</option></select>
        <button class="btn primary" id="new-go">+ 만들기</button>
      </div>
    </div>`;
  c.querySelector('#new-go').onclick = async () => {
    const name = c.querySelector('#new-name').value.trim();
    if (!name) return toast('전시명을 입력하세요');
    const { error } = await sb.from('gallery_exhibitions').insert({ name, category: c.querySelector('#new-cat').value, intro: `${name} 컬렉션의 명화를 감상하실 수 있습니다.`, published: false });
    if (error) return toast('오류: ' + error.message);
    toast('전시 생성됨 (비공개 상태) — 작품을 업로드한 뒤 공개하세요');
    renderExhibit();
  };
  for (const ex of EXS) c.appendChild(exRow(ex));
  $('#content').innerHTML = ''; $('#content').appendChild(c);
  if (OPEN_EX) {
    const anchor = document.getElementById('works-' + OPEN_EX);
    if (anchor) renderWorks(OPEN_EX);
  }
}
function exRow(ex) {
  const row = document.createElement('div');

/* ───────── 크롭 큐 (브라우저 캔버스 크롭 → 업로드) ───────── */
const cropState = { mode: 'upload', ex: null, artwork: null, exId: null, queue: [], file: null, img: null, scale: 1, box: { x: 0, y: 0, w: 0, h: 0 } };

/* ── 전시 전체 ZIP 다운로드 ── */
const sanitize = s => (s || '').replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, ' ').trim().slice(0, 80);
async function downloadAllZip(ex, btn) {
  if (btn.disabled) return;
  const orig = btn.textContent;
  btn.disabled = true;
  try {
    const { data: arts, error } = await sb.from('gallery_artworks').select('title, artist, image_path')
      .eq('exhibition_id', ex.id).order('sort').order('created_at');
    if (error) throw new Error(error.message);
    if (!arts.length) { toast('작품이 없습니다'); return; }
    const zip = new JSZip();
    const folder = zip.folder(sanitize(ex.name) || 'gallery');
    let done = 0, failed = 0;
    // 4개씩 병렬 다운로드
    const queue = [...arts.entries()];
    await Promise.all(Array.from({ length: 4 }, async () => {
      while (queue.length) {
        const [i, a] = queue.shift();
        try {
          const res = await fetch(artUrl(a.image_path));
          if (!res.ok) throw new Error(res.status);
          const name = `${String(i + 1).padStart(3, '0')}_${sanitize(a.title) || 'untitled'}${a.artist ? '_' + sanitize(a.artist) : ''}.jpg`;
          folder.file(name, await res.blob());
        } catch { failed++; }
        done++;
        btn.textContent = `⬇ ${done}/${arts.length}…`;
      }
    }));
    btn.textContent = '압축 중…';
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${sanitize(ex.name)}_1920x1080.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    toast(`✓ ${ex.name} — ${arts.length - failed}장 ZIP 다운로드${failed ? ` (실패 ${failed}장)` : ''}`);
  } catch (e) { toast('오류: ' + e.message); }
  btn.disabled = false;
  btn.textContent = orig;
}

/* ── 사이니지 URL 팝업 ── */

  const btn = $('#surl-copy');
  btn.textContent = '📋 복사하기';
  btn.style.background = ''; btn.style.borderColor = ''; btn.style.color = '';
}
function openSignageUrl(ex) {
  SURL_EX = ex;
  $('#surl-ex').textContent = `${ex.name} — 이 URL을 사이니지 기기(키오스크 브라우저)의 시작 주소로 등록하면 자동 재생됩니다`;
  $('#surl-t').value = localStorage.getItem('gallery-signage-t') || '15';
  surlBuild();
  $('#surl').style.display = 'flex';
}
$('#surl-t').oninput = () => { localStorage.setItem('gallery-signage-t', $('#surl-t').value); surlBuild(); };
$('#surl-close').onclick = () => { $('#surl').style.display = 'none'; };
$('#surl-copy').onclick = async () => {
  const url = $('#surl-url').value;
  const btn = $('#surl-copy');
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; }
  catch {
    // 폴백: 텍스트 선택 + execCommand
    const inp = $('#surl-url');
    inp.select(); inp.setSelectionRange(0, 9999);
    try { ok = document.execCommand('copy'); } catch {}
  }
  if (ok) {
    btn.textContent = '✓ 복사됨!';
    btn.style.background = 'var(--ok)'; btn.style.borderColor = 'var(--ok)'; btn.style.color = '#0c1a10';
  } else {
    btn.textContent = '⚠ 복사 실패 — 직접 선택하세요';
    $('#surl-url').select();
  }
};

/* ── 전용 대표 표지 업로드: 작품과 분리된 covers/ 공간에 저장 ── */
function startCoverCrop(ex, file) {
  cropState.mode = 'cover';
  cropState.ex = ex;
  cropState.file = file;
  $('#crop-queue').textContent = '대표 표지 — ' + ex.name;
  $('#m-title').value = ''; $('#m-artist').value = ''; $('#m-year').value = '';
  $('#keep-original').parentElement.style.display = 'none';
  $('#crop-modal').classList.add('open');
  const img = $('#crop-img');
  img.onload = () => { cropState.imgW = img.naturalWidth; cropState.imgH = img.naturalHeight; initCropBox(); };
  img.src = URL.createObjectURL(file);
}
async function applyCoverBlob(ex, blob) {
  const coverPath = `covers/${ex.id}_${uid().slice(0, 8)}.jpg`;
  const up = await sb.storage.from('gallery-art').upload(coverPath, blob, { contentType: 'image/jpeg' });
  if (up.error) throw new Error(up.error.message);
  const { error } = await sb.from('gallery_exhibitions').update({ cover_path: coverPath }).eq('id', ex.id);
  if (error) throw new Error(error.message);
  // 이전 전용 표지 정리 (covers/ 파일이면서 다른 전시가 안 쓰는 경우만)
  if (ex.cover_path && ex.cover_path.startsWith('covers/')) {
    const { data: others } = await sb.from('gallery_exhibitions').select('id').eq('cover_path', ex.cover_path).neq('id', ex.id);
    if (!others || !others.length) await sb.storage.from('gallery-art').remove([ex.cover_path]);
  }
  toast('대표 표지 적용됨: ' + ex.name);
  renderExhibit();
}
async function saveCover() {
  const img = $('#crop-img');
  const s = cropState.scale, b = cropState.box;
  const crop = { x: b.x * s, y: b.y * s, w: b.w * s, h: b.h * s };
  const blob = await canvasBlob(img, crop, 1920, 1080, 0.9);
  await applyCoverBlob(cropState.ex, blob);
  URL.revokeObjectURL(img.src);
  $('#crop-modal').classList.remove('open');
}

/* ───────── 표지 생성기 (배경 + 제목/부제 합성) ───────── */
const MK = { ex: null, bg: null };
const MK_FACTORY = { band: 38, bandh: 403, dim: 0, tsize: 180, ssize: 69, gap: 145, y: 52, sub: '소장 작품선' };
function mkDefaults() {
  try { return JSON.parse(localStorage.getItem('gallery-maker-defaults')) || null; } catch { return null; }
}
function mkSaveDefaults() {
  localStorage.setItem('gallery-maker-defaults', JSON.stringify({
    enabled: $('#mk-keep').checked,
    band: +$('#mk-band').value, bandh: +$('#mk-bandh').value, dim: +$('#mk-dim').value,
    tsize: +$('#mk-tsize').value, ssize: +$('#mk-ssize').value, gap: +$('#mk-gap').value,
    y: +$('#mk-y').value, sub: $('#mk-sub').value,
  }));
}
function mkUpdateVals() {
  $$('.mk-val').forEach(el => {
    const v = $('#' + el.dataset.for).value;
    el.textContent = ['mk-tsize', 'mk-ssize', 'mk-gap', 'mk-bandh'].includes(el.dataset.for) ? v + 'px' : v + '%';
  });
}
function openMaker(ex) {
  MK.ex = ex; MK.bg = null;
  $('#mk-title').value = ex.name || '';
  // 저장된 기본값이 켜져 있으면 그 세팅으로, 아니면 공장 기본값
  const d = mkDefaults();
  const useSaved = d && d.enabled;
  const v = useSaved ? d : MK_FACTORY;
  $('#mk-sub').value = v.sub ?? MK_FACTORY.sub;
  $('#mk-band').value = v.band ?? MK_FACTORY.band;
  $('#mk-bandh').value = v.bandh ?? MK_FACTORY.bandh;
  $('#mk-dim').value = v.dim ?? MK_FACTORY.dim;
  $('#mk-tsize').value = v.tsize ?? MK_FACTORY.tsize;
  $('#mk-ssize').value = v.ssize ?? MK_FACTORY.ssize;
  $('#mk-gap').value = v.gap ?? MK_FACTORY.gap;
  $('#mk-y').value = v.y ?? MK_FACTORY.y;
  $('#mk-keep').checked = !!useSaved;
  mkUpdateVals();
  $('#maker').classList.add('open');
  // 기본 배경: 현재 표지
  if (ex.cover_path) loadMakerBg(artUrl(ex.cover_path));
  else drawMaker();
  Promise.all([document.fonts.load("800 104px 'Nanum Myeongjo'"), document.fonts.load("400 42px 'Nanum Myeongjo'")]).then(drawMaker);
}
$('#mk-keep').onchange = () => mkSaveDefaults();
function loadMakerBg(url) {
  const im = new Image();
  im.crossOrigin = 'anonymous';
  im.onload = () => { MK.bg = im; drawMaker(); };
  im.onerror = () => toast('배경 이미지를 불러오지 못했습니다');
  im.src = url;
}
function drawMaker() {
  const cv = $('#maker-canvas'), ctx = cv.getContext('2d');
  const W = 1920, H = 1080;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#101014'; ctx.fillRect(0, 0, W, H);
  if (MK.bg) {
    const im = MK.bg;
    const r = Math.max(W / im.width, H / im.height);
    const w = im.width * r, h = im.height * r;
    ctx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
  }
  const dim = (+$('#mk-dim').value) / 100;
  if (dim > 0) { ctx.fillStyle = `rgba(0,0,0,${dim})`; ctx.fillRect(0, 0, W, H); }
  const tSize = +$('#mk-tsize').value;
  const sSize = +$('#mk-ssize').value;
  const gap = +$('#mk-gap').value;                 // 제목 중심 ↔ 부제 중심 거리
  const cy = H * (+$('#mk-y').value) / 100;        // 텍스트 블록 중심 (글자에만 적용)
  const title = $('#mk-title').value, sub = $('#mk-sub').value;
  // 띠: 화면 정중앙 고정 — 글자 위치·크기와 완전 분리, 띠 높이로만 결정
  const band = (+$('#mk-band').value) / 100;
  const bandH = +$('#mk-bandh').value;
  if (band > 0) {
    ctx.fillStyle = `rgba(0,0,0,${band})`;
    ctx.fillRect(0, H / 2 - bandH / 2, W, bandH);
  }
  const titleY = sub ? cy - gap / 2 : cy;
  const subY = cy + gap / 2;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 2;
  if (title) {
    ctx.font = `800 ${tSize}px 'Nanum Myeongjo', serif`;
    try { ctx.letterSpacing = Math.round(tSize * 0.03) + 'px'; } catch {}
    ctx.fillStyle = '#ffffff';
    ctx.fillText(title, W / 2, titleY);
  }
  if (sub) {
    ctx.font = `400 ${sSize}px 'Nanum Myeongjo', serif`;
    try { ctx.letterSpacing = Math.round(sSize * 0.25) + 'px'; } catch {}
    ctx.fillStyle = '#f0ece2';
    ctx.fillText(sub, W / 2, subY);
  }
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  try { ctx.letterSpacing = '0px'; } catch {}
}
['mk-title', 'mk-sub', 'mk-band', 'mk-bandh', 'mk-dim', 'mk-tsize', 'mk-ssize', 'mk-gap', 'mk-y'].forEach(id => document.addEventListener('input', e => {
  if (e.target.id !== id) return;
  mkUpdateVals();
  drawMaker();
  if ($('#mk-keep').checked) mkSaveDefaults();   // 기본값 유지 중이면 변경값도 즉시 저장
}));
$('#mk-bgfile').onchange = e => {
  const f = e.target.files[0];
  if (f) loadMakerBg(URL.createObjectURL(f));
  e.target.value = '';
};
$('#mk-bgart').onclick = () => {
  if (!MK.ex) return;
  pickArtwork(MK.ex, a => loadMakerBg(artUrl(a.image_path)), '배경으로 사용할 작품 선택');
};
$('#mk-cancel').onclick = () => $('#maker').classList.remove('open');
$('#mk-save').onclick = async () => {
  if (!MK.bg) return toast('배경 이미지를 먼저 선택하세요');
  const btn = $('#mk-save');
  btn.disabled = true; btn.textContent = '저장 중…';
  try {
    const blob = await new Promise(r => $('#maker-canvas').toBlob(r, 'image/jpeg', 0.9));
    await applyCoverBlob(MK.ex, blob);
    $('#maker').classList.remove('open');
  } catch (e) { toast('오류: ' + e.message); }
  btn.disabled = false; btn.textContent = '✓ 표지로 저장';
};

/* ── 기존 작품 재크롭: 보관 원본(비공개 버킷) 또는 로컬 원본 파일에서 ── */
async function recropArtwork(a, exId) {
  let blob = null, file = null;
  if (a.original_path) {
    toast('보관된 원본 불러오는 중…');
    const { data, error } = await sb.storage.from('gallery-originals').createSignedUrl(a.original_path, 3600);
    if (error) return toast('원본 URL 실패: ' + error.message);
    const res = await fetch(data.signedUrl);
    if (!res.ok) return toast('원본 다운로드 실패 (' + res.status + ')');
    blob = await res.blob();
    if (/tiff?/i.test(blob.type)) return toast('TIF 원본은 브라우저에서 열 수 없습니다. JPG/PNG 원본 파일을 선택해 주세요.');
  } else {
    // 클라우드에 원본이 없음 → 로컬 원본 파일 선택
    file = await new Promise(resolve => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/jpeg,image/png,image/webp';
      inp.onchange = () => resolve(inp.files[0] || null);
      inp.click();
    });
    if (!file) return;
    blob = file;
  }
  cropState.mode = 'recrop';
  cropState.artwork = a;
  cropState.exId = exId;
  cropState.file = file; // 로컬 파일이면 원본 보관 옵션에 사용
  $('#crop-queue').textContent = '재크롭 — ' + (a.title || '');
  $('#m-title').value = a.title || '';
  $('#m-artist').value = a.artist || '';
  $('#m-year').value = a.year || '';
  $('#keep-original').parentElement.style.display = (!a.original_path && file) ? '' : 'none';
  $('#crop-modal').classList.add('open');
  const img = $('#crop-img');
  img.onload = () => { cropState.imgW = img.naturalWidth; cropState.imgH = img.naturalHeight; initCropBox(); };
  img.src = URL.createObjectURL(blob);
}
async function saveRecrop() {
  const img = $('#crop-img');
  const s = cropState.scale, b = cropState.box;
  const crop = { x: b.x * s, y: b.y * s, w: b.w * s, h: b.h * s };
  const [edited, thumbB] = await Promise.all([
    canvasBlob(img, crop, 1920, 1080, 0.92),
    canvasBlob(img, crop, 480, 270, 0.8),
  ]);
  const a = cropState.artwork;
  const id = uid();
  const imagePath = `${cropState.exId}/${id}.jpg`;
  const thumbPath = `${cropState.exId}/thumbs/${id}.jpg`;
  let up = await sb.storage.from('gallery-art').upload(imagePath, edited, { contentType: 'image/jpeg' });
  if (up.error) throw new Error(up.error.message);
  await sb.storage.from('gallery-art').upload(thumbPath, thumbB, { contentType: 'image/jpeg' });
  let originalPath = a.original_path || null;
  if (!originalPath && cropState.file && $('#keep-original').checked) {
    originalPath = `${cropState.exId}/${id}_${cropState.file.name}`;
    const o = await sb.storage.from('gallery-originals').upload(originalPath, cropState.file, { contentType: cropState.file.type });
    if (o.error) { toast('원본 보관 실패: ' + o.error.message); originalPath = null; }
  }
  const { error } = await sb.from('gallery_artworks').update({
    title: $('#m-title').value, artist: $('#m-artist').value, year: $('#m-year').value,
    image_path: imagePath, thumb_path: thumbPath, original_path: originalPath,
  }).eq('id', a.id);
  if (error) throw new Error(error.message);
  // 전시 표지가 이 작품이었다면 표지 경로도 갱신
  const { data: ex } = await sb.from('gallery_exhibitions').select('id, cover_path').eq('id', cropState.exId).single();
  if (ex && ex.cover_path === a.image_path) await sb.from('gallery_exhibitions').update({ cover_path: imagePath }).eq('id', ex.id);
  // 이전 파일 정리
  await sb.storage.from('gallery-art').remove([a.image_path, a.thumb_path].filter(Boolean));
  URL.revokeObjectURL(img.src);
  $('#crop-modal').classList.remove('open');
  toast('재크롭 완료: ' + ($('#m-title').value || ''));
  renderWorks(cropState.exId);
}
function startCropQueue(ex, files) {
  const imgs = files.filter(f => /^image\//.test(f.type));
  if (!imgs.length) return;
  cropState.mode = 'upload';
  cropState.ex = ex;
  cropState.queue = imgs;
  $('#keep-original').parentElement.style.display = '';
  nextCrop();
}
function nextCrop() {
  if (!cropState.queue.length) {
    $('#crop-modal').classList.remove('open');
    toast('업로드 완료');
    OPEN_EX = cropState.ex.id;
    renderExhibit();
    return;
  }
  const file = cropState.queue.shift();
  cropState.file = file;
  $('#crop-queue').textContent = `남은 파일 ${cropState.queue.length + 1}개 — ${file.name}`;
  const meta = parseArtMeta(file.name);
  $('#m-title').value = meta.title; $('#m-artist').value = meta.artist; $('#m-year').value = meta.year;
  $('#crop-modal').classList.add('open');
  const img = $('#crop-img');
  img.onload = () => { cropState.imgW = img.naturalWidth; cropState.imgH = img.naturalHeight; initCropBox(); };
  img.src = URL.createObjectURL(file);
}
function initCropBox() {
  const img = $('#crop-img');
  const dw = img.clientWidth, dh = img.clientHeight;
  cropState.scale = img.naturalWidth / dw;
  let w = dw, h = dw * 9 / 16;
  if (h > dh) { h = dh; w = dh * 16 / 9; }
  cropState.box = { x: (dw - w) / 2, y: (dh - h) / 2, w, h };
  applyBox();
}
function applyBox() {
  const b = cropState.box, el = $('#crop-box');
  el.style.left = b.x + 'px'; el.style.top = b.y + 'px';
  el.style.width = b.w + 'px'; el.style.height = b.h + 'px';
  const s = cropState.scale;
  $('#crop-info').textContent = `원본 ${cropState.imgW}×${cropState.imgH} → 크롭 ${Math.round(b.w * s)}×${Math.round(b.h * s)} → 1920×1080` + (b.w * s < 1920 ? ' ⚠ 업스케일' : '');
}
function clampBox() {
  const img = $('#crop-img'), b = cropState.box;
  const dw = img.clientWidth, dh = img.clientHeight;
  b.w = Math.min(b.w, dw); b.h = b.w * 9 / 16;
  if (b.h > dh) { b.h = dh; b.w = b.h * 16 / 9; }
  b.x = Math.max(0, Math.min(b.x, dw - b.w));
  b.y = Math.max(0, Math.min(b.y, dh - b.h));
}
(() => {
  let mode = null, sx = 0, sy = 0, start = null;
  const box = $('#crop-box');
  const onDown = (e, m) => { mode = m; const p = e.touches ? e.touches[0] : e; sx = p.clientX; sy = p.clientY; start = { ...cropState.box }; e.preventDefault(); e.stopPropagation(); };
  box.addEventListener('mousedown', e => onDown(e, e.target.classList.contains('handle') ? 'resize' : 'move'));
  box.addEventListener('touchstart', e => onDown(e, e.target.classList.contains('handle') ? 'resize' : 'move'), { passive: false });
  const onMove = e => {
    if (!mode) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - sx, dy = p.clientY - sy;
    if (mode === 'move') { cropState.box.x = start.x + dx; cropState.box.y = start.y + dy; }
    else { cropState.box.w = start.w + dx; cropState.box.h = cropState.box.w * 9 / 16; }
    if (cropState.box.w < 80) { cropState.box.w = 80; cropState.box.h = 45; }
    clampBox(); applyBox();
  };
  addEventListener('mousemove', onMove); addEventListener('touchmove', onMove, { passive: true });
  addEventListener('mouseup', () => mode = null); addEventListener('touchend', () => mode = null);
  $('#crop-stage').addEventListener('wheel', e => {
    e.preventDefault();
    const b = cropState.box, f = e.deltaY < 0 ? 1.05 : 0.95;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    b.w *= f; b.h = b.w * 9 / 16;
    b.x = cx - b.w / 2; b.y = cy - b.h / 2;
    if (b.w < 80) { b.w = 80; b.h = 45; }
    clampBox(); applyBox();
  }, { passive: false });
})();
$('#crop-reset').onclick = initCropBox;
$('#crop-skip').onclick = () => {
  if (cropState.mode === 'recrop' || cropState.mode === 'cover') { $('#crop-modal').classList.remove('open'); return; }
  nextCrop();
};
// ✕ 닫기 / Esc: 현재 크롭과 남은 대기열 전부 취소
function cancelCrop() {
  if (!$('#crop-modal').classList.contains('open')) return;
  const hadQueue = cropState.mode === 'upload' && cropState.queue.length > 0;
  cropState.queue = [];
  $('#crop-modal').classList.remove('open');
  toast(hadQueue ? '크롭 취소됨 (남은 파일 포함)' : '크롭 취소됨');
  if (cropState.mode === 'upload' && cropState.ex) { OPEN_EX = cropState.ex.id; renderExhibit(); }
}
$('#crop-close').onclick = cancelCrop;
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#crop-modal').classList.contains('open')) { cancelCrop(); return; }
  if ($('#maker').classList.contains('open')) { $('#maker').classList.remove('open'); return; }
  if ($('#surl').style.display === 'flex') { $('#surl').style.display = 'none'; return; }
  if ($('#pwmod').style.display === 'flex') { $('#pwmod').style.display = 'none'; return; }
  if ($('#picker').classList.contains('open')) $('#picker').classList.remove('open');
});

function canvasBlob(imgEl, crop, w, h, q) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(imgEl, crop.x, crop.y, crop.w, crop.h, 0, 0, w, h);
  return new Promise(r => cv.toBlob(r, 'image/jpeg', q));
}
$('#crop-save').onclick = async () => {
  const btn = $('#crop-save');
  btn.disabled = true; btn.textContent = '업로드 중…';
  if (cropState.mode === 'recrop' || cropState.mode === 'cover') {
    try { cropState.mode === 'cover' ? await saveCover() : await saveRecrop(); }
    catch (e) { toast('오류: ' + e.message); }
    btn.disabled = false; btn.textContent = '✓ 업로드 (1920×1080)';
    return;
  }
  try {
    const img = $('#crop-img');
    const s = cropState.scale, b = cropState.box;
    const crop = { x: b.x * s, y: b.y * s, w: b.w * s, h: b.h * s };
    const [edited, thumbB] = await Promise.all([
      canvasBlob(img, crop, 1920, 1080, 0.92),
      canvasBlob(img, crop, 480, 270, 0.8),
    ]);
    const ex = cropState.ex;
    const id = uid();
    const imagePath = `${ex.id}/${id}.jpg`;
    const thumbPath = `${ex.id}/thumbs/${id}.jpg`;
    let up = await sb.storage.from('gallery-art').upload(imagePath, edited, { contentType: 'image/jpeg' });
    if (up.error) throw new Error(up.error.message);
    await sb.storage.from('gallery-art').upload(thumbPath, thumbB, { contentType: 'image/jpeg' });
    let originalPath = null;
    if ($('#keep-original').checked) {
      originalPath = `${ex.id}/${id}_${cropState.file.name}`;
      const o = await sb.storage.from('gallery-originals').upload(originalPath, cropState.file, { contentType: cropState.file.type });
      if (o.error) { toast('원본 보관 실패: ' + o.error.message); originalPath = null; }
    }
    const { error } = await sb.from('gallery_artworks').insert({
      exhibition_id: ex.id,
      title: $('#m-title').value, artist: $('#m-artist').value, year: $('#m-year').value,
      image_path: imagePath, thumb_path: thumbPath, original_path: originalPath,
    });
    if (error) throw new Error(error.message);
    // 첫 작품이면 표지로
    if (!ex.cover_path) { await sb.from('gallery_exhibitions').update({ cover_path: imagePath }).eq('id', ex.id); ex.cover_path = imagePath; }
    URL.revokeObjectURL(img.src);
    nextCrop();
  } catch (e) { toast('오류: ' + e.message); }
  btn.disabled = false; btn.textContent = '✓ 업로드 (1920×1080)';
};

/* ───────── 음악 ───────── */
async function renderMusic() {
  const { data: music } = await sb.from('gallery_music').select('*').order('name');
  $('#content').innerHTML = `
    <div class="panel">
      <h3>음악 업로드</h3>
      <div class="frow">
        <label class="btn primary" style="cursor:pointer">파일 선택 (mp3/m4a/ogg)<input type="file" id="mu-files" multiple accept="audio/*" style="display:none"></label>
        <span id="mu-status" style="color:var(--fg-dim);font-size:12px"></span>
      </div>
    </div>
    <div class="panel">
      <h3>등록된 음악 (${(music || []).length})</h3>
      <div id="mu-list"></div>
    </div>`;
  const list = $('#mu-list');
  for (const m of music || []) {
    const d = document.createElement('div');
    d.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)';
    d.innerHTML = `<span style="flex:1">♪ ${m.name}</span>
      <audio controls preload="none" src="${musicUrl(m.path)}" style="height:30px"></audio>
      <button class="btn danger">삭제</button>`;
    d.querySelector('button').onclick = async () => {
      if (!confirm(`'${m.name}' 삭제?`)) return;
      await sb.storage.from('gallery-music').remove([m.path]);
      await sb.from('gallery_music').delete().eq('id', m.id);
      renderMusic();
    };
    list.appendChild(d);
  }
  $('#mu-files').onchange = async e => {
    const files = [...e.target.files];
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      $('#mu-status').textContent = `업로드 중 ${i + 1}/${files.length}: ${f.name}`;
      const p = `${uid()}_${f.name.replace(/[^\w.\-가-힣 ]/g, '')}`;
      const up = await sb.storage.from('gallery-music').upload(p, f, { contentType: f.type || 'audio/mpeg' });
      if (up.error) { toast('실패: ' + up.error.message); continue; }
      await sb.from('gallery_music').insert({ name: f.name.replace(/\.[^.]+$/, ''), path: p });
    }
    toast('음악 업로드 완료');
    renderMusic();
  };
}

boot();
</script>
